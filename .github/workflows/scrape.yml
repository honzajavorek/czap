name: scrape

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"  # every day at 4am
  workflow_dispatch:  # allows manual triggering of the workflow

# Allow GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Poetry
        run: pipx install poetry

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml
          cache: poetry

      - name: Install Python dependencies
        run: poetry install

      - name: Test
        run: poetry run pytest

      # For some reason the 'overwrite' option for the Scrapy feed exporters
      # doesn't work reliably for me ¯\_(ツ)_/¯
      - name: Clear data file
        run: rm items.json

      - name: Restore Scrapy cache
        uses: actions/cache/restore@v6
        with:
          path: .scrapy
          key: scrapy-cache-${{ github.run_id }}
          restore-keys: |
            scrapy-cache-

      # Scrapy exits with 0 even if the spider got closed early because of an
      # error, so check how it finished to avoid committing incomplete data
      - name: Scrape
        run: |
          set -o pipefail
          poetry run scrapy crawl czap 2>&1 | tee scrapy.log
          grep -q "'finish_reason': 'finished'" scrapy.log

      - name: Save Scrapy cache
        uses: actions/cache/save@v6
        with:
          path: .scrapy
          key: scrapy-cache-${{ github.run_id }}

      - name: Check that data got exported
        run: jq -e 'type == "array" and length > 0' items.json

      - name: Save to Git
        uses: EndBug/add-and-commit@v11
        with:
          add: items.json
          author_name: "scraper"
          author_email: "scraper@honzajavorek.cz"
          message: "update items 📥"

      - name: Move files
        run: |
          mkdir -p site
          mv items.* site/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  # Deploying in the same job right after the upload sometimes fails, because
  # the artifact isn't listed yet. A dedicated job is what deploy-pages recommends.
  deploy:
    needs: scrape
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
